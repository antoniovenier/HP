<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prévia no celular</title>
<meta name="description" content="Demonstração da prévia do post em moldura de celular, por rede (gerado por previa_celular.py demo).">
<style>
:root{
  --fundo:#f6f5f1; --superficie:#ffffff; --texto:#17161a; --suave:#5d5a66; --linha:#e4e2ea; --realce:#c2185b;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fundo:#0d0a14; --superficie:#161120; --texto:#f5f1fb; --suave:#b3a9c6; --linha:#2b2339; --realce:#ff4d94;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --fundo:#0d0a14; --superficie:#161120; --texto:#f5f1fb; --suave:#b3a9c6; --linha:#2b2339; --realce:#ff4d94;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.demo{max-width:880px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:18px}
.demo-topo{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.demo h1{margin:0;font-size:clamp(24px,5vw,32px);line-height:1.1}
.demo p{margin:0;color:var(--suave)}
.temas{display:flex;gap:6px}
.temas button{min-height:40px;padding:8px 14px;border-radius:99px;border:1px solid var(--linha);background:var(--superficie);color:var(--texto);font-family:inherit;font-size:14px;font-weight:600;line-height:1;cursor:pointer}
.temas button[aria-pressed="true"]{border-color:var(--realce);box-shadow:inset 0 0 0 1px var(--realce)}
.lista{display:grid;gap:0;background:var(--superficie);border:1px solid var(--linha);border-radius:18px;padding:6px 14px}
.item{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--linha)}
.item:first-child{border-top:0}
.capa{width:64px;height:80px;border-radius:10px;overflow:hidden;background:var(--linha);cursor:pointer;display:block;padding:0;border:0}
.capa img{width:100%;height:100%;object-fit:cover;display:block}
.capa:focus-visible,.temas button:focus-visible{outline:3px solid var(--realce);outline-offset:2px}
.item b{display:block;overflow-wrap:anywhere}
.item small{color:var(--suave)}
.dica{font-size:13.5px}
</style>
<!-- previa-celular:inicio -->
<style id="previa-celular-css">
/* previa_celular.css — modal da prévia no celular (par do previa_celular.js).
 * Tudo com prefixo .pc- para não brigar com o CSS do painel.
 * Tema: claro por padrão; data-pc-tema="escuro" no <dialog> (o JS escolhe
 * sozinho pelo tema do painel). A tela do app tem o próprio tema (data-pc-app).
 * Tamanhos dentro da tela em --u = 1% da largura da tela (unidade cqw). */

.pc-modal, .pc-modal * { box-sizing: border-box; }
.pc-modal i { font-style: normal; }

.pc-modal {
  --pc-fundo: #ffffff; --pc-texto: #17161a; --pc-suave: #5d5a66; --pc-linha: #e4e2ea;
  --pc-chip: #f2f1f5; --pc-realce: #c2185b; --pc-realce-txt: #ffffff; --pc-foco: #2563eb;
  --pc-alerta: #b42318; --pc-ok: #067647; --pc-aviso: #fff4e5;
  color-scheme: light;
  position: fixed; inset: 0; margin: auto; padding: 0; border: 0;
  width: min(980px, calc(100vw - 32px)); max-width: 100vw;
  height: auto; max-height: calc(100vh - 32px);
  border-radius: 20px; overflow: hidden;
  background: var(--pc-fundo); color: var(--pc-texto);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px; line-height: 1.45; text-align: left;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
}
.pc-modal[data-pc-tema="escuro"] {
  --pc-fundo: #15111d; --pc-texto: #f5f1fb; --pc-suave: #b3a9c6; --pc-linha: #2e2640;
  --pc-chip: #211a2d; --pc-realce: #ff4d94; --pc-realce-txt: #16101d; --pc-foco: #ffb057;
  --pc-alerta: #ff8a80; --pc-ok: #4ade80; --pc-aviso: #3a2a12;
  color-scheme: dark;
}
.pc-modal:not([open]) { display: none; }
.pc-modal[open] { animation: pc-entra .18s ease-out; }
.pc-modal::backdrop { background: rgba(10, 8, 14, .72); }
@keyframes pc-entra { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }

.pc-caixa { display: flex; flex-direction: column; max-height: calc(100vh - 32px); }
@supports (height: 100dvh) {
  .pc-modal { max-height: calc(100dvh - 32px); }
  .pc-caixa { max-height: calc(100dvh - 32px); }
}

.pc-cabeca { flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 12px 6px 20px; }
.pc-titulos { flex: 1; min-width: 0; }
.pc-modal .pc-titulo {
  margin: 0; padding: 0; font-family: inherit; font-size: 17px; font-weight: 700; line-height: 1.25;
  letter-spacing: normal; text-transform: none; color: inherit; background: none;
  -webkit-text-fill-color: currentColor;
}
.pc-sub { margin: 2px 0 0; color: var(--pc-suave); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-fechar {
  flex: none; width: 44px; height: 44px; padding: 0; border-radius: 50%; cursor: pointer;
  display: grid; place-items: center;
  border: 1px solid var(--pc-linha); background: var(--pc-chip); color: var(--pc-texto);
}
.pc-fechar .pc-ic { width: 20px; height: 20px; }

.pc-redes {
  flex: none; display: flex; gap: 8px; padding: 6px 16px 12px; overflow-x: auto;
  scrollbar-width: none; -webkit-overflow-scrolling: touch; border-bottom: 1px solid var(--pc-linha);
}
.pc-redes::-webkit-scrollbar { display: none; }
.pc-aba {
  flex: none; min-height: 40px; padding: 8px 14px; border-radius: 99px; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--pc-linha); background: var(--pc-chip); color: var(--pc-texto);
  font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1;
}
.pc-aba[aria-selected="true"] { background: var(--pc-realce); color: var(--pc-realce-txt); border-color: transparent; }
.pc-modal :focus-visible { outline: 3px solid var(--pc-foco); outline-offset: 2px; }

.pc-corpo {
  flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain;
  display: grid; grid-template-columns: auto minmax(240px, 360px); justify-content: center; align-items: start;
  gap: 20px 28px; padding: 16px 20px 22px;
}
.pc-palco { display: flex; justify-content: center; padding: 4px 10px; }

/* ficha ao lado (ou embaixo, no celular) */
.pc-ficha { display: grid; gap: 12px; align-content: start; font-size: 14px; min-width: 0; }
.pc-modal .pc-ficha-tit {
  margin: 0; font-family: inherit; font-size: 16px; font-weight: 700; line-height: 1.3;
  letter-spacing: normal; text-transform: none; color: inherit;
}
.pc-dados { margin: 0; display: grid; gap: 8px; }
.pc-dados > div { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--pc-linha); }
.pc-dados dt { color: var(--pc-suave); font-weight: 600; }
.pc-dados dd { margin: 0; overflow-wrap: anywhere; }
.pc-alerta { color: var(--pc-alerta); }
.pc-ok { color: var(--pc-ok); }
.pc-aviso { margin: 0; padding: 8px 10px; border-radius: 10px; background: var(--pc-aviso); }
.pc-dica { margin: 0; color: var(--pc-suave); }
.pc-botoes { display: flex; flex-wrap: wrap; gap: 8px; }
.pc-botao {
  min-height: 40px; padding: 8px 14px; border-radius: 99px; cursor: pointer;
  border: 1px solid var(--pc-linha); background: var(--pc-chip); color: var(--pc-texto);
  font-family: inherit; font-size: 13.5px; font-weight: 600; line-height: 1.2;
}
.pc-botao[aria-pressed="true"] { border-color: var(--pc-realce); box-shadow: inset 0 0 0 1px var(--pc-realce); }
.pc-nota { margin: 0; color: var(--pc-suave); font-size: 12.5px; }

/* ---------------------------------------------------------------- */
/* moldura do celular (genérica: sem marca, só o formato com notch)  */
/* ---------------------------------------------------------------- */
.pc-celular {
  --pc-larg: min(86vw, 330px, max(210px, calc((100vh - 190px) * .48)));
  position: relative; flex: none; width: var(--pc-larg);
  padding: calc(var(--pc-larg) * .035);
  border-radius: calc(var(--pc-larg) * .15);
  background: linear-gradient(150deg, #2c2c31, #0f0f11 42%, #1c1c20);
  box-shadow: inset 0 0 0 calc(var(--pc-larg) * .007) #4b4b53, 0 0 0 1px rgba(0, 0, 0, .5),
              0 24px 60px -12px rgba(0, 0, 0, .55);
  container-type: inline-size;
}
@supports (height: 100dvh) {
  .pc-celular { --pc-larg: min(86vw, 330px, max(210px, calc((100dvh - 190px) * .48))); }
}
.pc-celular::before, .pc-celular::after {
  content: ""; position: absolute; width: calc(var(--pc-larg) * .014); background: #2b2b30; border-radius: 3px;
}
.pc-celular::before { right: calc(var(--pc-larg) * -.012); top: 24%; height: 11%; }
.pc-celular::after { left: calc(var(--pc-larg) * -.012); top: 19%; height: 7%; box-shadow: 0 calc(var(--pc-larg) * .19) 0 #2b2b30; }
.pc-notch {
  position: absolute; z-index: 7; left: 50%; top: calc(var(--pc-larg) * .035); transform: translateX(-50%);
  width: 33%; height: calc(var(--pc-larg) * .066); background: #0f0f11;
  border-radius: 0 0 calc(var(--pc-larg) * .045) calc(var(--pc-larg) * .045);
}
.pc-notch::after {
  content: ""; position: absolute; right: 22%; top: 30%; width: calc(var(--pc-larg) * .024);
  height: calc(var(--pc-larg) * .024); border-radius: 50%; background: #1d2230;
  box-shadow: inset 0 0 0 1px #2c3345;
}

/* tela */
.pc-tela {
  --u: 3px;
  --a-fundo: #ffffff; --a-texto: #0f0f10; --a-sub: #6b6b73; --a-linha: #e7e7ea; --a-tag: #1d4fa3; --a-bloco: #efeff2;
  position: relative; width: 100%; aspect-ratio: 9 / 19.5; overflow: hidden; isolation: isolate;
  border-radius: calc(var(--pc-larg) * .118);
  background: var(--a-fundo); color: var(--a-texto);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: calc(var(--u) * 3.5); line-height: 1.3; -webkit-font-smoothing: antialiased;
}
@supports (width: 1cqw) { .pc-tela { --u: 1cqw; } }
.pc-tela[data-pc-app="escuro"] {
  --a-fundo: #000000; --a-texto: #f3f3f5; --a-sub: #a1a1aa; --a-linha: #27272a; --a-tag: #93b4ff; --a-bloco: #1b1b1f;
}
.pc-l-vertical, .pc-l-story { background: #000; color: #fff; }
.pc-tela p { margin: 0; }
.pc-ic {
  display: block; flex: none; width: 1.3em; height: 1.3em;
  fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
}
.pc-empurra { flex: 1; }
.pc-tag { color: var(--a-tag); }
.pc-mais {
  all: unset; cursor: pointer; color: var(--a-sub); font-weight: 500;
}
.pc-mais:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; border-radius: 3px; }
.pc-sem-capa { color: var(--a-sub); font-size: calc(var(--u) * 3.4); padding: 1em; text-align: center; }

/* barra de status e barra de baixo */
.pc-status {
  position: absolute; z-index: 5; top: 0; left: 0; right: 0; height: calc(var(--u) * 12);
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(var(--u) * 1.5) calc(var(--u) * 7.5) 0; font-weight: 600; font-size: calc(var(--u) * 3.9);
  background: var(--a-fundo); color: var(--a-texto);
}
.pc-l-vertical .pc-status, .pc-l-story .pc-status { background: #000; color: #fff; }
.pc-st-ics { display: flex; align-items: center; gap: calc(var(--u) * 1.4); }
.pc-sinal { display: flex; align-items: flex-end; gap: calc(var(--u) * .5); height: calc(var(--u) * 2.8); }
.pc-sinal i { display: block; width: calc(var(--u) * .8); background: currentColor; border-radius: 1px; }
.pc-sinal i:nth-child(1) { height: 35%; } .pc-sinal i:nth-child(2) { height: 55%; }
.pc-sinal i:nth-child(3) { height: 78%; } .pc-sinal i:nth-child(4) { height: 100%; }
.pc-bateria {
  display: block; width: calc(var(--u) * 6.2); height: calc(var(--u) * 2.9); padding: 1px;
  border: 1.5px solid currentColor; border-radius: calc(var(--u) * .9);
  background: linear-gradient(90deg, currentColor 72%, transparent 72%) content-box;
}
.pc-nav {
  position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; height: calc(var(--u) * 21);
  display: flex; justify-content: space-around; align-items: flex-start; padding-top: calc(var(--u) * 3);
  background: var(--a-fundo); color: var(--a-texto); border-top: 1px solid var(--a-linha);
}
.pc-nav .pc-ic { width: calc(var(--u) * 6.6); height: calc(var(--u) * 6.6); }
.pc-nav-escura { top: calc(var(--u) * 189.8); height: auto; background: #000; color: #fff; border-top-color: rgba(255, 255, 255, .12); }
.pc-home {
  position: absolute; z-index: 6; left: 50%; bottom: calc(var(--u) * 1.8); transform: translateX(-50%);
  width: 35%; height: calc(var(--u) * 1.2); border-radius: 99px; background: var(--a-texto); opacity: .85;
}
.pc-l-vertical .pc-home, .pc-l-story .pc-home { background: #fff; }

/* avatar (letra do canal; troca pela foto quando houver) */
.pc-avatar {
  position: relative; flex: none; display: inline-grid; place-items: center; overflow: hidden;
  width: calc(var(--u) * 8); height: calc(var(--u) * 8); border-radius: 50%;
  background: var(--pc-cor-canal, #7c3aed); color: #fff; font-weight: 700; font-size: calc(var(--u) * 3.6);
}
.pc-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; }
.pc-anel { overflow: visible; box-shadow: 0 0 0 calc(var(--u) * .6) var(--a-fundo), 0 0 0 calc(var(--u) * 1.1) var(--pc-cor-canal, #c2185b); }
.pc-anel img { border-radius: 50%; }

/* mídia */
.pc-midia { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #1c1c1f; }
.pc-midia img, .pc-midia video { display: block; width: 100%; height: 100%; max-width: none; object-fit: cover; }

/* ---- vertical: Reels, TikTok, Shorts, FB Reels ---- */
.pc-video { position: absolute; left: 0; right: 0; top: calc(var(--u) * 12); height: calc(var(--u) * 177.78); overflow: hidden; background: #111; color: #fff; }
.pc-video .pc-tag { color: #fff; font-weight: 600; }
.pc-video .pc-mais { color: rgba(255, 255, 255, .88); font-weight: 600; }
.pc-video .pc-sem-capa { color: rgba(255, 255, 255, .7); }
.pc-degrade {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(0, 0, 0, .35) 0, transparent 16%, transparent 55%, rgba(0, 0, 0, .6) 100%);
}
.pc-topo-app {
  position: absolute; z-index: 4; top: 0; left: 0; right: 0; height: var(--z-topo);
  display: flex; align-items: center; justify-content: space-between; padding: 0 calc(var(--u) * 4);
  font-size: calc(var(--u) * 5); font-weight: 700; text-shadow: 0 1px 2px rgba(0, 0, 0, .5);
}
.pc-topo-app .pc-ic { width: calc(var(--u) * 6.5); height: calc(var(--u) * 6.5); filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, .45)); }
.pc-topo-app .pc-ics { display: flex; gap: calc(var(--u) * 4); }
.pc-tt-abas { flex: 1; display: flex; justify-content: center; gap: calc(var(--u) * 4); font-size: calc(var(--u) * 4.2); }
.pc-tt-abas span { opacity: .72; font-weight: 600; }
.pc-tt-abas b { border-bottom: 2px solid #fff; padding-bottom: 2px; }
.pc-trilho {
  position: absolute; z-index: 4; right: 0; width: var(--z-dir); top: var(--z-trilho); bottom: calc(var(--u) * 3);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: calc(var(--u) * 3.4);
}
.pc-tr {
  display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * .6);
  font-size: calc(var(--u) * 2.8); font-weight: 600; text-shadow: 0 1px 2px rgba(0, 0, 0, .6);
}
.pc-tr .pc-ic { width: calc(var(--u) * 7.4); height: calc(var(--u) * 7.4); filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, .45)); }
.pc-tr small { font-size: inherit; line-height: 1.1; text-align: center; max-width: 100%; }
.pc-tr-capa { width: calc(var(--u) * 7); height: calc(var(--u) * 7); border-radius: calc(var(--u) * 1.6); border: 2px solid #fff; background: #555; }
.pc-tr-av { position: relative; margin-bottom: calc(var(--u) * 1.6); }
.pc-tr-av .pc-avatar { width: calc(var(--u) * 10); height: calc(var(--u) * 10); border: 2px solid #fff; }
.pc-mais-av {
  position: absolute; left: 50%; bottom: calc(var(--u) * -2); transform: translateX(-50%);
  width: calc(var(--u) * 4.6); height: calc(var(--u) * 4.6); border-radius: 50%;
  display: grid; place-items: center; background: #e11d48; color: #fff; font-weight: 800; font-size: calc(var(--u) * 3.6); line-height: 1;
}
.pc-inv { transform: rotate(180deg); }
.pc-gira { animation: pc-gira 5s linear infinite; }
@keyframes pc-gira { to { transform: rotate(360deg); } }
.pc-info {
  position: absolute; z-index: 4; left: 0; right: var(--z-dir); bottom: 0;
  display: flex; flex-direction: column; gap: calc(var(--u) * 1.8);
  padding: 0 calc(var(--u) * 3.5) calc(var(--u) * 3.5); text-shadow: 0 1px 2px rgba(0, 0, 0, .55);
}
.pc-info.pc-expandida {
  right: 0; top: 35%; justify-content: flex-end; overflow-y: auto; padding-top: calc(var(--u) * 8);
  background: linear-gradient(180deg, transparent, rgba(0, 0, 0, .8) 22%);
}
.pc-conta { display: flex; align-items: center; gap: calc(var(--u) * 2.2); font-size: calc(var(--u) * 3.6); min-width: 0; }
.pc-conta b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-seguir {
  flex: none; padding: calc(var(--u) * .6) calc(var(--u) * 2.4); border: 1px solid rgba(255, 255, 255, .85);
  border-radius: calc(var(--u) * 2); font-size: calc(var(--u) * 3.2); font-weight: 600;
}
.pc-e-yt .pc-seguir { background: #fff; color: #0f0f0f; border-color: #fff; border-radius: 99px; text-shadow: none; }
.pc-legenda { font-size: calc(var(--u) * 3.5); line-height: 1.35; overflow-wrap: anywhere; }
.pc-audio { display: flex; align-items: center; gap: calc(var(--u) * 1.5); font-size: calc(var(--u) * 3.1); min-width: 0; }
.pc-audio .pc-ic { width: calc(var(--u) * 3.6); height: calc(var(--u) * 3.6); }
.pc-audio span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* zonas cobertas (botão "Mostrar zonas cobertas") */
.pc-zonas { position: absolute; z-index: 3; inset: 0; pointer-events: none; display: none; }
.pc-mostra-zonas .pc-zonas { display: block; }
.pc-z {
  position: absolute; display: flex; align-items: center; justify-content: center;
  background: repeating-linear-gradient(135deg, rgba(255, 45, 85, .45) 0 7px, rgba(255, 45, 85, .2) 7px 14px);
  outline: 1.5px dashed rgba(255, 255, 255, .9); outline-offset: -1.5px;
}
.pc-z span {
  font-size: calc(var(--u) * 2.8); font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  background: rgba(0, 0, 0, .6); color: #fff; padding: 1px 6px; border-radius: 4px;
}
.pc-z-topo { top: 0; left: 0; right: 0; height: var(--z-topo); }
.pc-z-base { bottom: 0; left: 0; right: var(--z-dir); height: var(--z-base); }
.pc-z-cheia { right: 0; }
.pc-z-dir { right: 0; width: var(--z-dir); top: var(--z-trilho); bottom: 0; }

/* ---- story ---- */
.pc-video-story { border-radius: calc(var(--u) * 3); }
.pc-degrade-topo { background: linear-gradient(180deg, rgba(0, 0, 0, .45), transparent 18%); }
.pc-story-barras {
  position: absolute; z-index: 4; top: calc(var(--u) * 2); left: calc(var(--u) * 2.5); right: calc(var(--u) * 2.5);
  height: calc(var(--u) * .7); border-radius: 99px; background: rgba(255, 255, 255, .4);
}
.pc-story-barras i { display: block; width: 40%; height: 100%; border-radius: inherit; background: #fff; }

  function resolverTema(pedido) {
    if (pedido === "claro" || pedido === "escuro") return pedido;
    var d = document.documentElement, t = d.getAttribute("data-theme");
    if (t === "dark") return "escuro";
    if (t === "light") return "claro";
    try {
      var cs = (getComputedStyle(d).colorScheme || "") + " " + (getComputedStyle(document.body).colorScheme || "");
      if (/\bdark\b/.test(cs) && !/\blight\b/.test(cs)) return "escuro";
      if (/\blight\b/.test(cs) && !/\bdark\b/.test(cs)) return "claro";
    } catch (e) { /* sem getComputedStyle */ }
    return (raiz.matchMedia && raiz.matchMedia("(prefers-color-scheme: dark)").matches) ? "escuro" : "claro";
  }

      "<div class=\"pc-cabeca\"><div class=\"pc-titulos\"><h2 class=\"pc-titulo\" id=\"pc-titulo\">Prévia no celular</h2>" +
      "<p class=\"pc-sub\" id=\"pc-sub\"></p></div>" +
      "<button type=\"button\" class=\"pc-fechar\" data-pc-acao=\"fechar\" aria-label=\"Fechar prévia\">" + icone("fechar") + "</button></div>" +
      "<div class=\"pc-redes\" role=\"tablist\" aria-label=\"Redes\"></div>" +
      "<div class=\"pc-corpo\"><div class=\"pc-palco\" id=\"pc-palco\" role=\"tabpanel\"></div>" +
      "<div class=\"pc-ficha\" aria-live=\"polite\"></div></div></div>";
    document.body.appendChild(d);
    d.addEventListener("click", aoClicar);
    d.addEventListener("keydown", aoTeclar);
    d.addEventListener("close", limpar);
    d.addEventListener("cancel", function (ev) { ev.preventDefault(); fechar(); });
    E.dlg = d;
    return d;
  }

  function aoClicar(ev) {
    if (ev.target === E.dlg) { fechar(); return; }   /* clique fora da caixa */
    var aba = ev.target.closest ? ev.target.closest("[data-pc-rede]") : null;
    if (aba) { selecionar(aba.getAttribute("data-pc-rede"), true); return; }
    var bt = ev.target.closest ? ev.target.closest("[data-pc-acao]") : null;
    if (!bt) return;
    var acao = bt.getAttribute("data-pc-acao");
    if (acao === "fechar") fechar();
    else if (acao === "mais") { E.expandida = true; renderPalco(".pc-legenda"); }
    else if (acao === "zonas") { E.zonas = !E.zonas; renderPalco("[data-pc-acao=zonas]"); }
    else if (acao === "tema-app") { E.temaApp = E.temaApp === "escuro" ? "claro" : "escuro"; renderPalco("[data-pc-acao=tema-app]"); }
    else if (acao === "ant" || acao === "prox") {
      var n = (E.post.laminas && E.post.laminas.length) || 1;
      E.lamina = Math.max(0, Math.min(n - 1, E.lamina + (acao === "prox" ? 1 : -1)));
      renderPalco(acao === "prox" ? (E.lamina >= n - 1 ? ".pc-seta-ant" : ".pc-seta-prox") : (E.lamina === 0 ? ".pc-seta-prox" : ".pc-seta-ant"));
    } else if (acao === "todas") {
      E.todas = true;
      E.redes = PADRAO.slice();
      if (E.redes.indexOf(E.atual) < 0) E.redes.push(E.atual);
      E.redes.sort(function (a, b) { return ORDEM.indexOf(a) - ORDEM.indexOf(b); });
      renderAbas();
      renderPalco();
      focarAba();
    } else if (acao === "extra" && E.opcoes.acaoExtra && typeof E.opcoes.acaoExtra.executar === "function") {
      var fn = E.opcoes.acaoExtra.executar;
      E.origem = null;
      fechar();
      fn();
    }
  }

  function aoTeclar(ev) {
    if (ev.key === "Escape") { ev.preventDefault(); fechar(); return; }
    if (ev.key === "Tab") {
      var f = focaveis();
      if (!f.length) return;
      var ativo = document.activeElement, pri = f[0], ult = f[f.length - 1];
      if (ev.shiftKey && (ativo === pri || !E.dlg.contains(ativo))) { ev.preventDefault(); ult.focus(); }
      else if (!ev.shiftKey && (ativo === ult || !E.dlg.contains(ativo))) { ev.preventDefault(); pri.focus(); }
      return;
    }
    var aba = ev.target.closest ? ev.target.closest("[data-pc-rede]") : null;
    if (!aba) return;
    var i = E.redes.indexOf(E.atual), novo = -1;
    if (ev.key === "ArrowRight" || ev.key === "ArrowDown") novo = (i + 1) % E.redes.length;
    else if (ev.key === "ArrowLeft" || ev.key === "ArrowUp") novo = (i - 1 + E.redes.length) % E.redes.length;
    else if (ev.key === "Home") novo = 0;
    else if (ev.key === "End") novo = E.redes.length - 1;
    if (novo >= 0) { ev.preventDefault(); selecionar(E.redes[novo], true); }
  }

  function selecionar(k, focar) {
    if (!REDES[k]) return;
    E.atual = k;
    E.expandida = false;
    E.lamina = 0;
    renderAbas();
    renderPalco();
    if (focar) focarAba();

  function focarAba() {
    var b = E.dlg.querySelector("[data-pc-rede=\"" + E.atual + "\"]");

      b.focus();

  function renderAbas() {
    E.dlg.querySelector(".pc-redes").innerHTML = E.redes.map(function (k) {
      var r = REDES[k], sel = k === E.atual;

        "\" aria-selected=\"" + sel + "\" aria-controls=\"pc-palco\" tabindex=\"" + (sel ? "0" : "-1") +
        "\" title=\"" + esc(r.rotulo) + "\">" + esc(r.curto) + "</button>";
    }).join("");
  }

  function colocarMidia(caixa, idx) {
    var p = E.post, r = REDES[E.atual];
    var fotos = (p.laminas && p.laminas.length) ? p.laminas : [p.capa];
    var src = fotos[idx] || p.capa || "";
    var usaVideo = idx === 0 && p.video && (r.layout === "vertical" || r.layout === "story" || r.layout === "feed" ||
      r.layout === "texto_em_cima");
    caixa.textContent = "";
    if (usaVideo) {
      var v = document.createElement("video");
      v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
      v.setAttribute("playsinline", ""); v.setAttribute("muted", "");
      if (p.capa) v.poster = p.capa;
      v.src = p.video;
      v.setAttribute("aria-label", "Vídeo do post");
      caixa.appendChild(v);
      v.addEventListener("loadedmetadata", function () { mostrarCorte(v.videoWidth, v.videoHeight); });
      var pr = v.play && v.play();
      if (pr && pr.catch) pr.catch(function () { /* autoplay bloqueado: fica o poster */ });
      return;
    }
    if (!src) {
      caixa.innerHTML = "<span class=\"pc-sem-capa\">sem capa</span>";
      return;
    }
    var img = document.createElement("img");
    img.alt = "Capa do post";
    img.decoding = "async";
    var rapida = idx === 0 && p.capa_rapida && p.capa_rapida !== src ? p.capa_rapida : "";
    img.src = rapida || src;
    if (rapida) {  /* miniatura na hora; troca pela nítida quando chegar */
      var nitida = new Image();
      nitida.onload = function () { if (img.isConnected) img.src = src; };
      nitida.src = src;
    }
    img.addEventListener("load", function () { if (idx === 0) mostrarCorte(img.naturalWidth, img.naturalHeight); });
    img.addEventListener("error", function () {
      if (rapida && img.src !== rapida) img.src = rapida;
      else caixa.innerHTML = "<span class=\"pc-sem-capa\">capa não carregou</span>";
    });
    caixa.appendChild(img);
  }

  function mostrarCorte(w, h) {
    var alvo = E.dlg && E.dlg.querySelector("[data-pc-corte]");
    if (!alvo || !w || !h) return;
    var r = REDES[E.atual], prop = proporcaoDe(E.post, r, E.atual), c = calcularCorte(w, h, prop);
    if (!c) return;
    var base = w + "×" + h + ". ";
    alvo.innerHTML = esc(base) + (c.perde === 0 ? "<b class=\"pc-ok\">encaixa sem corte</b>"
      : "<b class=\"pc-alerta\">perde ~" + c.perde + "% " + esc(c.onde) + "</b> nesta rede");
  }

  function renderPalco(focarSeletor) {
    var p = E.post, k = E.atual, r = REDES[k];
    var est = {expandida: E.expandida, lamina: E.lamina, zonas: E.zonas, temaApp: E.temaApp, todas: E.todas};
    var palco = E.dlg.querySelector(".pc-palco");

      "<div class=\"pc-tela pc-l-" + r.layout + " pc-e-" + r.estilo + (E.zonas ? " pc-mostra-zonas" : "") +
      "\" data-pc-app=\"" + (escuraSempre ? "escuro" : E.temaApp) + "\">" + montarTela(p, k, est) +
      "<i class=\"pc-home\" aria-hidden=\"true\"></i></div><i class=\"pc-notch\" aria-hidden=\"true\"></i></div>";
    E.dlg.querySelector(".pc-ficha").innerHTML = fichaHtml(p, k, est, E.opcoes);
    var caixas = palco.querySelectorAll("[data-pc-midia]");
    for (var i = 0; i < caixas.length; i++) colocarMidia(caixas[i], r.layout === "pin" ? 0 : E.lamina);
    if (!temMidia(p)) {
      var alvo = E.dlg.querySelector("[data-pc-corte]");
      if (alvo) alvo.textContent = "sem capa (post só de texto)";
    }
    if (p.avatar) {
      var avs = palco.querySelectorAll("[data-pc-avatar]");
      for (var j = 0; j < avs.length; j++) {
        var im = document.createElement("img");
        im.alt = "";
        im.src = p.avatar;
        avs[j].appendChild(im);
      }

    if (focarSeletor) {
      var alvoFoco = E.dlg.querySelector(focarSeletor + ":not([disabled])") || E.dlg.querySelector(".pc-fechar");

        alvoFoco.setAttribute("tabindex", "-1");   /* legenda aberta: leitor de tela lê o texto inteiro */
      }
      if (alvoFoco && alvoFoco.focus) alvoFoco.focus();
    }
  }

  function normalizarPost(post) {
    var p = {};
    for (var k in (post || {})) if (Object.prototype.hasOwnProperty.call(post, k)) p[k] = post[k];
    if (typeof p.laminas === "string") p.laminas = [p.laminas];
    if (Array.isArray(p.imagens) && !p.laminas) p.laminas = p.imagens;
    if (p.laminas && !p.laminas.length) p.laminas = null;
    if (!p.capa && p.laminas) p.capa = p.laminas[0];
    return p;
  }

  function abrir(post, opcoes) {
    if (typeof document === "undefined") return null;
    opcoes = opcoes || {};
    garantirDialogo();
    E.post = normalizarPost(post);
    E.opcoes = opcoes;
    E.origem = opcoes.origem || document.activeElement;
    E.todas = !!opcoes.todas;
    E.redes = E.todas ? PADRAO.slice() : redesDoPost(E.post);
    var pedida = opcoes.rede ? normalizarRede(opcoes.rede, E.post) : null;
    E.atual = (pedida && E.redes.indexOf(pedida) >= 0) ? pedida : E.redes[0];
    E.zonas = !!opcoes.zonas;
    E.expandida = false;
    E.lamina = 0;
    var tema = resolverTema(opcoes.tema || CONFIG.tema);
    E.dlg.setAttribute("data-pc-tema", tema);
    E.temaApp = opcoes.temaApp || tema;
    var sub = [E.post.canal, E.post.conta ? "@" + String(E.post.conta).replace(/^@/, "") : ""].filter(Boolean).join(" · ");
    E.dlg.querySelector(".pc-sub").textContent = sub || (E.post.titulo || "");

    renderPalco();
    if (!E.dlg.open) {
      E.overflow = document.documentElement.style.overflow;
      document.documentElement.style.overflow = "hidden";

      else E.dlg.setAttribute("open", "");
    }
    focarAba();
    return E.dlg;
  }

  function limpar() {
    if (!E.dlg) return;
    var vs = E.dlg.querySelectorAll("video");
    for (var i = 0; i < vs.length; i++) { try { vs[i].pause(); } catch (e) { /* ok */ } }
    var palco = E.dlg.querySelector(".pc-palco");
    if (palco) palco.innerHTML = "";
    document.documentElement.style.overflow = E.overflow || "";
    var o = E.origem;
    E.origem = null;
    if (o && o.focus && document.contains(o)) { try { o.focus(); } catch (e) { /* ok */ } }
  }

  function fechar() {
    if (!E.dlg) return;
    if (typeof E.dlg.close === "function" && E.dlg.open) E.dlg.close();   /* dispara "close" -> limpar */
    else { E.dlg.removeAttribute("open"); limpar(); }
  }

  function lerPostDoElemento(el) {
    var post = {};
    var bruto = el.getAttribute("data-previa");

  }

  function prepararCapas(raizDom, seletor) {
    var els = (raizDom || document).querySelectorAll(seletor);
    for (var i = 0; i < els.length; i++) {
      var el = els[i];

  }

  /* Liga a prévia em todos os [data-previa] (inclusive os que aparecerem depois). */
  function ligar(raizDom, opcoes) {
    opcoes = opcoes || {};
    raizDom = raizDom || document;
    var seletor = opcoes.seletor || "[data-previa]";
    function abrirDe(el) {
      var o = {};
      for (var k in opcoes) if (Object.prototype.hasOwnProperty.call(opcoes, k)) o[k] = opcoes[k];
      o.origem = el;
      abrir(typeof opcoes.obterPost === "function" ? opcoes.obterPost(el) : lerPostDoElemento(el), o);
    }
    raizDom.addEventListener("click", function (ev) {
      var el = ev.target.closest && ev.target.closest(seletor);

    for (var k in (op || {})) if (Object.prototype.hasOwnProperty.call(op, k)) CONFIG[k] = op[k];
    return CONFIG;
  }

    REDES: REDES, ORDEM: ORDEM, PADRAO: PADRAO,
    abrir: abrir, fechar: fechar, ligar: ligar, configurar: configurar,
    deItemAgenda: deItemAgenda, cortarLegenda: cortarLegenda, redesDoPost: redesDoPost,

<div class="demo">

<script>
(function(){
  /* capas de exemplo desenhadas na hora (nada vem da internet) */
  function capa(w, h, c1, c2, texto, rotulo){
    var cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    var g = cv.getContext("2d"), gr = g.createLinearGradient(0, 0, w, h);
    gr.addColorStop(0, c1); gr.addColorStop(1, c2); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.globalAlpha = .18; g.fillStyle = "#fff";
    for (var i = 0; i < 7; i++){ g.beginPath(); g.arc((i*173)%w, (i*291)%h, w*(.12+.05*(i%3)), 0, 7); g.fill(); }
    g.globalAlpha = 1; g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
    var tam = Math.round(w*.095); g.font = "800 " + tam + "px system-ui, sans-serif";
    var palavras = texto.split(" "), linhas = [], l = "";
    palavras.forEach(function(p){ var t = l ? l + " " + p : p; if (g.measureText(t).width > w*.84 && l){ linhas.push(l); l = p; } else l = t; });
    linhas.push(l);
    var y0 = h/2 - (linhas.length-1)*tam*.6;
    linhas.forEach(function(t, i){ g.fillText(t, w/2, y0 + i*tam*1.2); });
    if (rotulo){ g.font = "600 " + Math.round(w*.045) + "px system-ui, sans-serif"; g.globalAlpha=.85; g.fillText(rotulo, w/2, h*.9); }
    return cv.toDataURL("image/jpeg", .86);
  }

     capa: capa(540, 960, "#ff3d8b", "#5b21b6", "NPC ROUBA SEU CARRO?", "9:16")},
    {canal:"Receitas | HP", conta:"@hp.receitas", cor:"#ff7a1a", tipo:"carrossel", redes:["instagram","facebook","threads","pinterest"],

     titulo:"Placar: 2 x 1", legenda:"",
     capa: capa(540, 960, "#15803d", "#052e16", "FIM DE JOGO 2 x 1", "story 9:16")},
    {canal:"Destinos | HP", conta:"@hp.destinos", cor:"#00c2d1", tipo:"pin", redes:["pinterest"],

    {canal:"Filmes e Séries | HP", conta:"@hp.filmes", cor:"#f5b301", tipo:"texto", redes:["threads"],
     titulo:"Qual série você recomeçaria do zero?",
     legenda:"Se você pudesse apagar da memória UMA série só pra assistir de novo como se fosse a primeira vez, qual seria? 🍿\n\nA minha: Dark. E a sua?"},
    {canal:"Carros | HP", conta:"@hp.carros", cor:"#ff3b3b", tipo:"estatico",
     titulo:"Opala: a história do rei das ruas",
     legenda:"Opala: a história do rei das ruas 🏁 Por que o Chevrolet Opala virou lenda no Brasil e quanto custa um hoje (valores aproximados). Arrasta pro lado!",
     capa: capa(720, 720, "#ff3b3b", "#7f1d1d", "OPALA, O REI DAS RUAS", "1:1 (sem redes: mostra todas)")}
  ];
  var lista = document.getElementById("lista");
  POSTS.forEach(function(p, i){
    var d = document.createElement("div"); d.className = "item";
    var b = document.createElement("button"); b.type = "button"; b.className = "capa";
    b.setAttribute("aria-label", "Ver prévia no celular: " + p.titulo);
    var src = p.capa || (p.laminas && p.laminas[0]);
    if (src){ var im = document.createElement("img"); im.alt = ""; im.src = src; b.appendChild(im); }
    else { b.textContent = "Aa"; b.style.fontWeight = "800"; }
    b.addEventListener("click", function(){ PreviaCelular.abrir(POSTS[i], {origem: b}); });
    var t = document.createElement("div");
    t.innerHTML = "<b></b><small></small>";
    t.firstChild.textContent = p.titulo;
    t.lastChild.textContent = p.canal + " · " + (p.tipo || "") + " · " + ((p.redes && p.redes.join(", ")) || "todas as redes");
    d.appendChild(b); d.appendChild(t); lista.appendChild(d);
  });
  /* tema da página (a prévia segue sozinha) */
  var bts = document.querySelectorAll(".temas button");
  Array.prototype.forEach.call(bts, function(bt){
    bt.addEventListener("click", function(){

      Array.prototype.forEach.call(bts, function(x){ x.setAttribute("aria-pressed", String(x === bt)); });
    });
  });
})();
